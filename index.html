<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Roblox Music Bulk Uploader</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; }
    .risky { border-color: #e33; background: #fff5f5; }
    .safe { border-color: #2a2; background: #f5fff7; }
    button { cursor: pointer; padding: 6px 12px; border-radius: 6px; border: none; background: #333; color: white; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .status { font-size: 0.85rem; color: #666; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>🎵 Bulk Upload Musik ke Roblox</h1>
  <p>Pilih beberapa file musik, sistem akan cek dulu potensi copyright-nya sebelum kamu upload.</p>

  <input type="file" id="fileInput" multiple accept="audio/*" />
  <button id="checkBtn">Cek & Tampilkan</button>

  <div id="results" style="margin-top: 20px;"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const checkBtn = document.getElementById('checkBtn');
    const resultsDiv = document.getElementById('results');

    checkBtn.onclick = async () => {
      const files = fileInput.files;
      if (!files.length) return alert('Pilih file dulu');

      const formData = new FormData();
      for (const f of files) formData.append('files', f);

      resultsDiv.innerHTML = 'Mengecek...';
      const res = await fetch('/api/precheck', { method: 'POST', body: formData });
      const data = await res.json();

      resultsDiv.innerHTML = '';
      data.results.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'row ' + (item.risky ? 'risky' : 'safe');
        div.innerHTML = `
          <div>
            <strong>${item.filename}</strong>
            <div class="status">
              ${item.error ? item.error :
                item.risky
                  ? `⚠️ Terdeteksi: ${item.matchInfo.title} - ${item.matchInfo.artist}`
                  : '✅ Tidak terdeteksi cocok dengan lagu di database'}
            </div>
          </div>
          <button data-path="${item.tempPath}" data-name="${item.filename}">Upload ke Roblox</button>
        `;
        resultsDiv.appendChild(div);
      });

      resultsDiv.querySelectorAll('button').forEach((btn) => {
        btn.onclick = async () => {
          btn.disabled = true;
          btn.textContent = 'Mengupload...';
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tempPath: btn.dataset.path, displayName: btn.dataset.name }),
          });
          const data = await res.json();
          btn.textContent = res.ok ? 'Terkirim ✅' : 'Gagal ❌';
          if (!res.ok) console.error(data);
        };
      });
    };
  </script>
</body>
</html>
